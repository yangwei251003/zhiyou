appId: com.yangwei.zhiyou
productName: BossHunter Next
artifactName: BossHunter-Next-${version}-windows-${arch}.${ext}
electronDist: node_modules/electron/dist

directories:
  output: release

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - out/main/ingestWorker.js
compression: normal
npmRebuild: false
buildDependenciesFromSource: false
electronLanguages:
  - zh-CN
  - en-US

win:
  executableName: BossHunter-Next
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false

publish: null
