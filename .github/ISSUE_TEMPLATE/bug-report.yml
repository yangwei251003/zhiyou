name: Bug report
description: Report a reproducible problem using synthetic data only
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not upload a real resume, credential, vault, or personal document. Use Security Advisories for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Use synthetic information and list exact steps.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed and expected result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all personal data, credentials, and private documents.
          required: true
