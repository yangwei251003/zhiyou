name: Feature request
description: Suggest an evidence-first career workflow improvement
title: '[Feature] '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the job-seeker problem, not only a proposed UI.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and evidence boundary
      description: Explain what success means and what AI must not infer.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require CAPTCHA bypass, fingerprint evasion, or unattended bulk applications.
          required: true
